[project]
name = "qudas"
version = "0.2.1"
authors = [
  { name="Keiichiro Higa", email="higa.devel@gmail.com" },
]
description = "Quantum data transform package"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
# コア: numpy + matplotlib
dependencies = [
    "numpy>=1.24,<3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# 量子ゲート（Qiskit）
gate = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
]
# アニーリング・データ変換一式（matplotlib はコアに含む）
annealing = [
    "dimod>=0.12",
    "amplify>=1.0",
    "pyqubo>=1.4",
    "PuLP>=2.7",
    "pandas>=2.0",
    "networkx>=3.1",
    "sympy>=1.12",
    "scipy>=1.10",
]
# 全機能（gate + annealing）
all = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "dimod>=0.12",
    "amplify>=1.0",
    "pyqubo>=1.4",
    "PuLP>=2.7",
    "pandas>=2.0",
    "networkx>=3.1",
    "sympy>=1.12",
    "scipy>=1.10",
]
dev = [
    "black>=24.8",
    "build>=1.2",
    "flake8",
    "pytest",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
    "sphinx>=7.1",
    "sphinx-basic-ng>=1.0.0b2",
    "furo>=2024.1",
    "twine>=5.1",
    "readme_renderer>=43",
]
test = [
    "torch>=2.2",
]

[project.urls]
homepage = "https://github.com/devel-system/qudas"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qudas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
# リポジトリ直下のソースを先に読み、.venv 内の古い pip 版 qudas より優先する
pythonpath = ["."]

[tool.black]
line-length = 88
skip-string-normalization = true
target-version = ['py38']
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''
